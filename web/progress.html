<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progress · openLMS</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  main { padding: 24px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; max-width: 1360px; }
  .profile { grid-column: 1 / -1; display: flex; gap: 20px; align-items: center; padding: 22px 24px; overflow: hidden; position: relative; }
  .profile .big { width: 64px; height: 64px; font-size: 22px; background: var(--brand); }
  .profile h1 { font-size: 22px; font-weight: 800; }
  .kpis { display: flex; gap: 28px; margin-left: auto; }
  .kpi b { font-size: 24px; font-weight: 800; display: block; }
  .kpi span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .panel { padding: 20px; margin-bottom: 20px; }
  .scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .score { border: 1px solid var(--line); border-radius: 12px; padding: 14px; position: relative; overflow: hidden; }
  .score .top { height: 4px; position: absolute; inset: 0 0 auto 0; }
  .score b { font-size: 26px; font-weight: 800; }
  .score small { display: block; color: var(--muted); font-size: 12px; }
  .bars .row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 54px; gap: 12px; align-items: center; padding: 8px 0; }
  .bars .track { height: 12px; background: var(--canvas); border-radius: 999px; overflow: hidden; display: flex; }
  .bars .track span { height: 100%; }
  .bars .n { font-size: 12px; font-weight: 800; text-align: right; color: var(--ink-2); }
  .feed { padding: 0; overflow: hidden; }
  .feed header { padding: 18px 18px 0; }
  .ftabs { display: flex; gap: 6px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .ftabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 12px; color: var(--ink-2); }
  .ftabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .n-item { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: relative; }
  .n-item.unread { background: #FFF8F6; }
  .n-item.unread::before { content: ''; position: absolute; left: 7px; top: 22px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
  .n-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .n-item b { font-size: 13px; display: block; }
  .n-item p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .n-item small { font-size: 11px; color: var(--muted); font-weight: 700; }
  .feed .scroll { max-height: 720px; overflow: auto; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 16px; } .profile { flex-wrap: wrap; } .kpis { margin-left: 0; flex-wrap: wrap; gap: 18px; } }
</style></head>
<body>
<div class="with-side">
  <main>
    <section class="card profile" id="profile"></section>
    <div>
      <section class="card panel"><div class="section-title">Recent results</div><div class="scores" id="scores"></div></section>
      <section class="card panel"><div class="section-title">Work by subject <span class="muted" style="font-size:12px;font-weight:700">done / total</span></div><div class="bars" id="bars"></div></section>
    </div>
    <section class="card feed"><header class="section-title" style="margin:0">Updates <span class="pill red" id="unread"></span></header>
      <div class="ftabs" id="ftabs"><button class="on" data-f="all">All</button><button data-f="unread">Unread</button><button data-f="fa">Tests</button><button data-f="ann">Announcements</button></div>
      <div class="scroll" id="feed"></div></section>
  </main>
</div>
<script src="data.js"></script>
<script>window.LMS || document.write('<script src="assets/data.example.js"><\/script>')</script>
<script src="assets/app.js"></script>
<script>
mountChrome('progress', null);
const T = assignments(), graded = T.filter(t => /graded/.test(t.status) && t.score != null && t.score !== 'None');
const avg = graded.length ? Math.round(graded.reduce((a, t) => a + t.score / t.total, 0) / graded.length * 100) : 0;
document.getElementById('profile').innerHTML = `
  <span class="avatar big">${initials(D.student)}</span><div style="position:relative"><h1>${esc(D.student)}</h1><span class="muted">${esc(D.program)} · ${esc(D.year)}</span></div>
  <div class="kpis" style="position:relative"><div class="kpi"><b>${avg}%</b><span>Average score</span></div><div class="kpi"><b>${T.filter(isDone).length}/${T.length}</b><span>Tasks done</span></div><div class="kpi"><b>${D.attendance.percentage}%</b><span>Attendance</span></div></div>`;
document.getElementById('scores').innerHTML = graded.map(t => {
  const s = subj(t.subject), p = Math.round(t.score / t.total * 100);
  return `<div class="score"><span class="top" style="background:${s.c1}"></span><span class="pill" style="background:${s.c2};color:${s.c1};margin-bottom:8px">${esc(s.short)}</span><br><b>${+t.score}</b><span class="muted">/${+t.total}</span>
    <small>${esc(t.title)} · ${esc(t.kind)}</small><div style="height:6px;background:var(--canvas);border-radius:9px;margin-top:10px"><div style="width:${p}%;height:100%;background:${p >= 70 ? '#2E8B57' : p >= 50 ? '#E8A33D' : '#D64545'};border-radius:9px"></div></div></div>`;
}).join('') || '<span class="muted">No graded work yet</span>';
const by = {};
T.forEach(t => { const k = subj(t.subject).short; (by[k] ||= { s: subj(t.subject), done: 0, total: 0 }); by[k].total++; if (isDone(t)) by[k].done++; });
const max = Math.max(...Object.values(by).map(b => b.total));
document.getElementById('bars').innerHTML = Object.entries(by).sort((a, b) => b[1].total - a[1].total).map(([k, b]) => `
  <div class="row"><b style="font-size:13px">${esc(k)}</b><div class="track" style="width:${b.total / max * 100}%"><span style="width:${b.done / b.total * 100}%;background:${b.s.c1}"></span><span style="flex:1;background:${b.s.c2}"></span></div><span class="n">${b.done} / ${b.total}</span></div>`).join('');
const feed = [
  ...D.notifications.map(n => ({ kind: 'n', type: n.type, title: n.title, msg: n.message, by: n.actor, at: n.at, unread: !n.read })),
  ...D.announcements.map(a => ({ kind: 'ann', type: 'ann', title: a.title, msg: a.message, by: a.by, at: a.at, unread: false })),
].sort((a, b) => new Date(b.at) - new Date(a.at));
document.getElementById('unread').textContent = `${D.unread} unread`;
const ic = t => t === 'ann' ? ['megaphone', '#E3F2EF', '#0B5A54'] : /fa|test|eol|assess/.test(t) ? ['tasks', '#FBE6E6', '#D64545'] : ['sparkle', '#E5EDFB', '#3B6FD8'];
function renderFeed(f) {
  document.getElementById('feed').innerHTML = feed.filter(x => f === 'all' || (f === 'unread' ? x.unread : f === 'ann' ? x.kind === 'ann' : x.kind === 'n' && /fa|test|eol|assess/.test(x.type)))
    .slice(0, 40).map(x => { const [i, bg, c] = ic(x.type); return `<div class="n-item ${x.unread ? 'unread' : ''}"><span class="n-ic" style="background:${bg};color:${c}">${icon(i, 16)}</span><div><b>${esc(x.title)}</b><p>${esc(x.msg)}</p><small>${esc(x.by || '')} · ${ago(x.at)}</small></div></div>`; }).join('');
}
renderFeed('all');
document.getElementById('ftabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#ftabs button').forEach(x => x.classList.toggle('on', x === b)); renderFeed(b.dataset.f); };
</script>
</body></html>
