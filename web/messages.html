<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages · openLMS</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  main { padding: clamp(14px, 1.8vw, 28px) clamp(14px, 2vw, 32px); }
  .chat { display: grid; grid-template-columns: clamp(260px, 26vw, 360px) minmax(0, 1fr); height: calc(100vh - 64px - 2 * clamp(14px, 1.8vw, 28px)); min-height: 480px; overflow: hidden; }
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .list header { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); }
  .list header h1 { font-size: 20px; }
  .threads { overflow-y: auto; flex: 1; }
  .thread { display: flex; gap: 12px; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; width: 100%; text-align: left; background: none; color: inherit; }
  .thread:hover { background: #F6F9F8; }
  .thread.on { background: var(--brand-soft); border-left-color: var(--brand); }
  .thread > div { min-width: 0; flex: 1; }
  .thread b { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
  .thread b small { font-weight: 600; color: var(--muted); font-size: 11px; flex: none; }
  .thread p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .pane header h2 { font-size: 17px; }
  .pane header small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
  .back { display: none; border: 0; background: none; color: var(--ink); }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 6px; background: linear-gradient(180deg, #F8FBFA, #fff); }
  .day { align-self: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 10px 0 4px; }
  .bubble { max-width: min(560px, 78%); padding: 9px 13px; border-radius: 16px; background: var(--canvas); color: var(--ink); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.mine { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .bubble:not(.mine) { border-bottom-left-radius: 6px; }
  .bubble small { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 700; opacity: .7; text-align: right; }
  .compose { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
  .compose textarea { flex: 1; font: inherit; border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 12px; resize: none; max-height: 160px; min-height: 44px; }
  .compose textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(18,128,122,.12); }
  .compose .btn { height: 44px; display: inline-flex; align-items: center; gap: 6px; }
  .contacts { padding: 8px 16px 16px; overflow-y: auto; flex: 1; }
  .contact { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; border: 0; background: none; border-radius: 12px; color: inherit; }
  .contact:hover { background: #F6F9F8; }
  .contact b { display: block; font-size: 13.5px; }
  .contact small { color: var(--muted); font-weight: 600; font-size: 12px; }
  .blank { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-weight: 600; padding: 24px; }
  @media (max-width: 860px) {
    .chat { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - 64px - 28px); }
    .chat.open .list { display: none; }
    .chat:not(.open) .pane { display: none; }
    .back { display: block; }
  }
</style></head>
<body>
<div class="with-side">
  <main><section class="card chat" id="chat">
    <div class="list"><header><h1>Messages</h1><button class="btn ext" id="new">New</button></header><div class="threads" id="threads"></div></div>
    <div class="pane" id="pane"><div class="blank">Pick a conversation or start a new one.</div></div>
  </section></main>
</div>
<script src="assets/cache.js"></script>
<script>__lmsBoot()</script>
<script>window.LMS || (window.__lmsLoad && window.__lmsLoad()) || document.write('<script src="assets/data.example.js"><\/script>')</script>
<script src="assets/app.js"></script>
<script>
page(() => {
mountChrome('message', null, 'Search conversations…');
const chat = document.getElementById('chat'), pane = document.getElementById('pane'), list = document.getElementById('threads');
document.getElementById('new').innerHTML = `${icon('plus', 15)} New`;
if (!IN_APP) {
  pane.innerHTML = `<div class="blank"><div>Messaging needs the openLMS server.<br><br>${extLink(lmsUrl('/messaging'), 'Open messages on Indus LMS', 'btn')}</div></div>`;
  return;
}
let threads = D.threads || [], contacts = null, current = null, filter = '', last = '';
// Polling only while a conversation is open and visible, backing off when quiet (there is no websocket).
let timer = null, delay = 15000;
const roleName = r => titleCase(String(r || '').toLowerCase().replace(/_/g, ' '));

function drawThreads() {
  const q = filter.toLowerCase();
  const rows = threads.filter(t => !q || `${t.name} ${t.last}`.toLowerCase().includes(q));
  list.innerHTML = rows.map(t => `<button class="thread ${current?.userId === t.userId ? 'on' : ''}" data-u="${esc(t.userId)}" data-name="${esc(t.name)}" data-role="${esc(t.role || '')}">
      <span class="avatar">${initials(t.name)}</span><div><b>${esc(t.name)} <small>${t.at ? ago(t.at) : ''}</small></b><p>${esc(t.last || '')}</p></div></button>`).join('')
    || `<div class="empty-state"><b>${q ? 'No matches' : 'No conversations yet'}</b>${q ? '' : 'Start one with <i>New</i>.'}</div>`;
}
async function loadThreads() {
  try { threads = await api('messages/threads'); drawThreads(); } catch (e) { if (!threads.length) list.innerHTML = `<p class="inbox-empty">${esc(e.message)}</p>`; }
}
function dayLabel(d) {
  const x = new Date(d), t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - new Date(x.getFullYear(), x.getMonth(), x.getDate())) / 86400000);
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' });
}
function drawMessages(msgs) {
  const box = document.getElementById('msgs');
  if (!box) return;
  const sig = msgs.map(m => m.id).join(',');
  if (sig === last) return false;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  last = sig;
  let html = '', prev = '';
  for (const m of msgs) {
    const day = m.at ? dayLabel(m.at) : '';
    if (day !== prev) { html += `<div class="day">${esc(day)}</div>`; prev = day; }
    html += `<div class="bubble ${m.mine ? 'mine' : ''}">${esc(m.text)}<small>${fmtTime(m.at)}${m.mine && m.read ? ' · Read' : ''}</small></div>`;
  }
  box.innerHTML = html || '<div class="blank">No messages yet. Say hello.</div>';
  if (nearBottom || !box.dataset.ready) { box.scrollTop = box.scrollHeight; box.dataset.ready = '1'; }
  return true;
}
async function poll(first = false) {
  clearTimeout(timer);
  if (!current || (document.hidden && !first)) return; // a hidden tab stops polling, but still loads once
  try {
    const { messages } = await api(`messages/conversation/${encodeURIComponent(current.userId)}`);
    delay = drawMessages(messages) ? 15000 : Math.min(delay * 2, 120000);
  } catch (e) { delay = Math.min(delay * 2, 120000); }
  timer = setTimeout(poll, delay);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { delay = 15000; poll(); loadThreads(); } }, { signal: pageSignal() });
onTeardown(() => clearTimeout(timer));

function open(user) {
  current = user; last = ''; delay = 15000;
  chat.classList.add('open');
  history.replaceState(null, '', `messages.html?u=${encodeURIComponent(user.userId)}`);
  pane.innerHTML = `<header><button class="back" id="back" aria-label="Back to conversations">${icon('back', 20)}</button><span class="avatar">${initials(user.name)}</span>
      <div><h2>${esc(user.name || 'Conversation')}</h2><small>${esc(roleName(user.role))}${user.subjects ? ' · ' + esc(user.subjects) : ''}</small></div></header>
    <div class="msgs" id="msgs" aria-live="polite">${skeleton(3)}</div>
    <form class="compose" id="compose"><textarea name="text" rows="1" placeholder="Write a message…" title="Enter sends · Shift+Enter adds a line" maxlength="4000" aria-label="Message"></textarea>
      <button class="btn" type="submit">${icon('send', 15)} Send</button></form>`;
  document.getElementById('back').onclick = () => { chat.classList.remove('open'); current = null; clearTimeout(timer); history.replaceState(null, '', 'messages.html'); drawThreads(); };
  const form = document.getElementById('compose'), ta = form.text;
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = async e => {
    e.preventDefault();
    const text = ta.value.trim(); if (!text) return;
    const btn = form.querySelector('button'); btn.disabled = true;
    try {
      await api('messages', { method: 'POST', json: { to_user_id: user.userId, text } });
      ta.value = ''; ta.oninput();
      last = ''; await poll(true); loadThreads();
    } catch (err) { toast(err.message, 'err'); }
    finally { btn.disabled = false; ta.focus(); }
  };
  drawThreads();
  poll(true);
  ta.focus();
}
async function newMessage() {
  current = null; chat.classList.add('open'); drawThreads();
  pane.innerHTML = `<header><button class="back" id="back" aria-label="Back to conversations">${icon('back', 20)}</button><div><h2>New message</h2><small>Teachers and staff you can message</small></div></header>
    <div style="padding:12px 16px 0"><input class="input" type="search" id="who" placeholder="Search by name or subject…" aria-label="Search contacts"></div><div class="contacts" id="contacts">${skeleton(5)}</div>`;
  document.getElementById('back').onclick = () => { chat.classList.remove('open'); };
  try { contacts = contacts || await api('messages/contacts'); }
  catch (e) { document.getElementById('contacts').innerHTML = `<p class="inbox-empty">${esc(e.message)}</p>`; return; }
  const draw = q => {
    q = q.toLowerCase();
    document.getElementById('contacts').innerHTML = contacts.filter(c => !q || `${c.name} ${c.subjects} ${c.role}`.toLowerCase().includes(q)).map(c =>
      `<button class="contact" data-u="${esc(c.userId)}"><span class="avatar">${initials(c.name)}</span><div><b>${esc(c.name)}</b><small>${esc(roleName(c.role))}${c.subjects ? ' · ' + esc(c.subjects) : ''}</small></div></button>`).join('')
      || '<p class="inbox-empty">Nobody matches.</p>';
  };
  draw('');
  const who = document.getElementById('who');
  who.oninput = () => draw(who.value);
  who.focus();
  document.getElementById('contacts').onclick = e => { const b = e.target.closest('[data-u]'); if (b) open(contacts.find(c => c.userId === b.dataset.u)); };
}
list.onclick = e => { const b = e.target.closest('[data-u]'); if (b) open({ userId: b.dataset.u, name: b.dataset.name, role: b.dataset.role }); };
document.getElementById('new').onclick = newMessage;
document.getElementById('q').oninput = e => { filter = e.target.value; drawThreads(); };
drawThreads();
loadThreads().then(async () => {
  const u = new URLSearchParams(location.search).get('u');
  if (!u) return;
  let who = threads.find(x => x.userId === u);
  if (!who) { try { contacts = contacts || await api('messages/contacts'); who = contacts.find(c => c.userId === u); } catch (e) {} }
  open(who || { userId: u, name: 'Conversation' });
});
}, { detail: true });
</script>
</body></html>
