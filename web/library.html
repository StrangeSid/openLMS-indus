<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · openLMS</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  main { padding: clamp(18px, 2.2vw, 40px) clamp(18px, 2.4vw, 44px); }
  .head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; font-weight: 800; }
  .head p { margin: 4px 0 0; color: var(--muted); }
  .toggle { margin-left: auto; display: flex; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .toggle button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; color: var(--muted); }
  .toggle button.on { background: var(--brand-soft); color: var(--brand); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
  .chip.on { border-color: currentColor; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .types { display: flex; gap: 6px; margin-bottom: 20px; }
  .types .chip { font-size: 12px; padding: 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .tile { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,31,43,.09); }
  .thumb { height: 110px; position: relative; }
  .thumb .badge { position: absolute; left: 12px; bottom: -14px; width: 40px; height: 46px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 10px; display: grid; place-items: end center; padding-bottom: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
  .tile .body { padding: 22px 14px 14px; }
  .tile b { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
  .tile small { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  tr:hover td { background: var(--canvas); cursor: pointer; }
  .mini { display: inline-grid; place-items: center; width: 30px; height: 22px; border-radius: 4px; color: #fff; font-size: 9px; font-weight: 800; margin-right: 8px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(31,31,43,.12); transform: translateX(100%); transition: transform .2s; z-index: 10; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer .art { height: 180px; }
  .drawer .in { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .drawer dl { display: grid; grid-template-columns: 90px 1fr; gap: 8px; margin: 0; font-size: 13px; }
  .drawer dt { color: var(--muted); font-weight: 700; }
  .drawer dd { margin: 0; }
  .x { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow); font-size: 18px; }
  @media (max-width: 760px) { main { padding: 16px; } .drawer { width: 100%; } .hide-sm { display: none; } }
</style></head>
<body>
<div class="with-side">
  <main>
    <div class="head"><div><h1>Library</h1><p id="sub"></p></div>
      <div class="toggle"><button class="on" data-v="grid">Grid</button><button data-v="list">List</button></div></div>
    <div class="chips" id="chips"></div>
    <div class="types" id="types"></div>
    <div id="out"></div>
  </main>
</div>
<aside class="drawer" id="drawer"></aside>
<script src="data.js"></script>
<script>window.LMS || document.write('<script src="assets/data.example.js"><\/script>')</script>
<script src="assets/app.js"></script>
<script>
mountChrome('files', null, `Search ${D.resources.length} files by name, teacher, folder…`);
const R = D.resources.map((r, i) => ({ ...r, i, kind: fileKind(r.name), s: subj(r.subject) }));
let fSubj = 'all', fType = 'all', view = 'grid', q = '';
const subjects = [...new Map(R.map(r => [r.s.key, r.s])).values()];
const types = [...new Set(R.map(r => r.kind.label))];
document.getElementById('sub').textContent = `${R.length} files shared by your teachers across ${subjects.length} subjects${D.downloaded ? ' · saved to Downloads/induslms' : ''}`;
function chips() {
  document.getElementById('chips').innerHTML = `<button class="chip ${fSubj === 'all' ? 'on' : ''}" data-s="all" style="${fSubj === 'all' ? 'color:var(--brand)' : ''}">All subjects</button>` +
    subjects.map(s => `<button class="chip ${fSubj === s.key ? 'on' : ''}" data-s="${s.key}" style="${fSubj === s.key ? 'color:' + s.c1 : ''}"><i style="background:${s.c1}"></i>${esc(s.short)} <span class="muted">${R.filter(r => r.s.key === s.key).length}</span></button>`).join('');
  document.getElementById('types').innerHTML = ['all', ...types].map(t => `<button class="chip ${fType === t ? 'on' : ''}" data-t="${t}" style="${fType === t ? 'color:var(--ink)' : ''}">${t === 'all' ? 'All types' : t}</button>`).join('');
}
function render() {
  chips();
  const list = R.filter(r => (fSubj === 'all' || r.s.key === fSubj) && (fType === 'all' || r.kind.label === fType) &&
    (!q || `${r.title} ${r.teacher} ${r.folder}`.toLowerCase().includes(q)));
  document.getElementById('out').innerHTML = !list.length ? '<div class="card" style="padding:40px;text-align:center" >No files match</div>' : view === 'grid'
    ? `<div class="grid">${list.slice(0, 120).map(r => `<div class="card tile" data-i="${r.i}"><div class="thumb">${cover(r.subject + r.folder, 240, 110)}<span class="badge" style="background:${r.kind.color}">${r.kind.label}</span></div>
        <div class="body"><b>${esc(r.title)}</b><small>${esc(r.s.short)}${r.folder ? ' · ' + esc(r.folder) : ''}</small></div></div>`).join('')}</div>`
    : `<div class="card"><table><thead><tr><th>Name</th><th>Subject</th><th class="hide-sm">Folder</th><th class="hide-sm">Teacher</th></tr></thead><tbody>${list.map(r => `
        <tr data-i="${r.i}"><td><span class="mini" style="background:${r.kind.color}">${r.kind.label}</span>${esc(r.title)}</td><td><span class="pill" style="background:${r.s.c2};color:${r.s.c1}">${esc(r.s.short)}</span></td><td class="hide-sm muted">${esc(r.folder || '—')}</td><td class="hide-sm">${esc(r.teacher || '')}</td></tr>`).join('')}</tbody></table></div>`;
}
function open(r) {
  const d = document.getElementById('drawer');
  d.innerHTML = `<div class="art" style="position:relative">${cover(r.subject, 380, 180)}<button class="x" id="x">×</button></div><div class="in">
    <span class="pill" style="background:${r.kind.color};color:#fff;align-self:flex-start">${r.kind.label}</span>
    <h3 style="font-size:18px">${esc(r.title)}</h3>
    <dl><dt>Subject</dt><dd>${esc(titleCase(r.subject))}</dd><dt>Folder</dt><dd>${esc(r.folder || '—')}</dd><dt>Teacher</dt><dd>${esc(r.teacher || '—')}</dd><dt>File</dt><dd style="word-break:break-all">${esc(r.name)}</dd></dl>
    ${r.path ? `<a class="btn" style="text-align:center" href="${encodeURI(r.path)}" target="_blank">Open file</a>` : ''}
    ${extLink(lmsUrl(courseFor(r.subject)?.id ? `/courses/${courseFor(r.subject).id}/resources` : '/resources'), 'View on Indus LMS')}</div>`;
  d.classList.add('open');
  document.getElementById('x').onclick = () => d.classList.remove('open');
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-s]'), t = e.target.closest('[data-t]'), v = e.target.closest('[data-v]'), it = e.target.closest('[data-i]');
  if (s) { fSubj = s.dataset.s; render(); }
  else if (t) { fType = t.dataset.t; render(); }
  else if (v) { view = v.dataset.v; document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b === v)); render(); }
  else if (it) open(R[+it.dataset.i]);
});
document.getElementById('q').oninput = e => { q = e.target.value.toLowerCase(); render(); };
render();
</script>
</body></html>
