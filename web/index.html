<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · openLMS</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  main { padding: 26px 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; max-width: 1320px; }
  .head { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .head h1 { font-size: 24px; font-weight: 800; }
  .head p { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; transition: border-color .15s, box-shadow .15s; }
  .stat .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .stat b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; }
  .stat span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .stat.on { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .stat[data-tab=late].on { border-color: var(--late); box-shadow: 0 0 0 3px var(--late-soft); }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar h2 { font-size: 16px; font-weight: 800; margin-right: auto; }
  select { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; color: var(--ink-2); }
  .group { padding: 10px 18px 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: #FAFBFB; border-bottom: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 4px 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 13px 18px 13px 0; border-bottom: 1px solid var(--line); }
  .row .edge { align-self: stretch; }
  .row .chip { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .row b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 12px; color: var(--muted); font-weight: 600; }
  .row code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; background: var(--canvas); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--ink-2); }
  .row .right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .empty { padding: 48px 18px; text-align: center; color: var(--muted); font-weight: 600; }
  aside { display: flex; flex-direction: column; gap: 20px; }
  .box { padding: 18px; }
  .event { display: flex; gap: 12px; padding: 8px 0; }
  .date { width: 44px; flex: none; text-align: center; border-radius: 8px; background: var(--canvas); padding: 4px 0; }
  .date small { display: block; font-size: 10px; font-weight: 800; color: var(--brand); text-transform: uppercase; }
  .date b { font-size: 17px; }
  .ann { padding: 10px 0; border-top: 1px solid var(--line); }
  .ann:first-of-type { border-top: 0; }
  .ann b { display: block; font-size: 13px; }
  .ann span { font-size: 12px; color: var(--muted); }
  @media (max-width: 1060px) { main { grid-template-columns: 1fr; padding: 16px; } }
  @media (max-width: 560px) { .stats { gap: 8px; } .stat { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 12px; } .stat .ic { width: 28px; height: 28px; } .stat .ic svg { width: 16px; height: 16px; } .stat b { font-size: 20px; } .row { grid-template-columns: 4px 36px minmax(0, 1fr); } .row .right { grid-column: 3; justify-content: flex-start; } }
</style></head>
<body>
<div class="with-side">
  <main>
    <div class="head"><div><h1 id="hello"></h1><p id="today"></p></div></div>
    <section>
      <div class="stats" id="stats"></div>
      <div class="card">
        <div class="toolbar"><h2 id="listTitle">Assignments</h2>
          <select id="cls"><option value="all">All classes</option></select>
          <select id="sort"><option value="due">Sort by due date</option><option value="class">Sort by class</option></select></div>
        <div id="list"></div>
      </div>
    </section>
    <aside>
      <div class="card box"><div class="section-title">Coming up <a href="planner.html">Planner</a></div><div id="events"></div></div>
      <div class="card box"><div class="section-title">Announcements <a href="progress.html">All updates</a></div><div id="anns"></div></div>
    </aside>
  </main>
</div>
<script src="assets/cache.js"></script>
<script src="data.js"></script>
<script>window.LMS || (window.__lmsLoad && window.__lmsLoad()) || document.write('<script src="assets/data.example.js"><\/script>')</script>
<script src="assets/app.js"></script>
<script>
mountChrome('home');
const A = assignments();
const hour = TODAY.getHours();
document.getElementById('hello').textContent = `${hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening'}, ${D.student.split(' ')[0]}`;
document.getElementById('today').textContent = fmtDate(TODAY, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

const TABS = {
  upcoming: { label: 'Upcoming', icon: 'clock', bg: 'var(--accent-soft)', fg: '#9A6514', edge: 'var(--accent)' },
  done: { label: 'Done', icon: 'check', bg: 'var(--done-soft)', fg: '#23714A', edge: 'var(--done)' },
  late: { label: 'Late', icon: 'alert', bg: 'var(--late-soft)', fg: '#B23434', edge: 'var(--late)' },
};
let tab = (() => { try { return localStorage.getItem('home.tab') || 'upcoming'; } catch { return 'upcoming'; } })();
let cls = 'all', sort = 'due';

const used = [...new Map(A.map(a => [subj(a.subject).key, subj(a.subject)])).values()];
document.getElementById('cls').insertAdjacentHTML('beforeend', used.map(s => `<option value="${s.key}">${esc(s.short)}</option>`).join(''));

function weekBucket(d) {
  if (!d) return 'No deadline';
  const n = daysUntil(d);
  if (n <= 0) return 'Today';
  if (n <= 7) return 'This week';
  return 'Later';
}
function render() {
  document.getElementById('stats').innerHTML = Object.entries(TABS).map(([k, t]) => `
    <button class="stat ${tab === k ? 'on' : ''}" data-tab="${k}"><span class="ic" style="background:${t.bg};color:${t.fg}">${icon(t.icon)}</span>
    <div><b>${A.filter(a => a.state === k).length}</b><span>${t.label}</span></div></button>`).join('');
  let list = A.filter(a => a.state === tab && (cls === 'all' || subj(a.subject).key === cls));
  const t = TABS[tab];
  document.getElementById('listTitle').textContent = `${t.label} assignments`;
  // Upcoming: soonest first. Done: most recent submission first. Late: most recently missed first.
  const when = a => new Date(tab === 'done' ? a.submitted || a.due || a.assigned : a.due || a.assigned).getTime();
  list.sort((a, b) => sort === 'class' ? subj(a.subject).short.localeCompare(subj(b.subject).short) || when(a) - when(b)
    : tab === 'upcoming' ? (when(a) || Infinity) - (when(b) || Infinity) : when(b) - when(a));
  const groupOf = a => sort === 'class' ? subj(a.subject).short
    : tab === 'upcoming' ? weekBucket(a.due)
    : fmtDate(tab === 'done' ? a.submitted : a.due, { month: 'long', year: 'numeric' });
  let html = '', last = null;
  for (const a of list) {
    const g = groupOf(a), s = subj(a.subject);
    if (g !== last) { html += `<div class="group">${esc(g)}</div>`; last = g; }
    const detail = tab === 'done' ? `Turned in ${fmtDate(a.submitted || a.assigned)}` : a.due ? `Due ${fmtDate(a.due, { weekday: 'short', day: 'numeric', month: 'short' })}, ${fmtTime(a.due)}` : `Set ${fmtDate(a.assigned)}`;
    html += `<div class="row"><span class="edge" style="background:${t.edge}"></span>
      <a class="chip" href="class.html?c=${s.key}" title="Open ${esc(s.short)}" style="background:${s.c2};color:${s.c1}">${esc(s.short.slice(0, 2))}</a>
      <div style="min-width:0"><b>${esc(a.title)}</b><div class="meta">${esc(s.short)} · ${esc(a.kind)} · ${detail}${a.testId ? ` · Test ID <code>${esc(a.testId)}</code>` : ''}</div></div>
      <div class="right">${statusPill(a)}${actionFor(a)}</div></div>`;
  }
  document.getElementById('list').innerHTML = html || `<div class="empty">${tab === 'late' ? 'Nothing late. Nice work.' : tab === 'upcoming' ? 'No upcoming assignments.' : 'Nothing turned in yet.'}</div>`;
}
render();
document.getElementById('stats').onclick = e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem('home.tab', tab); } catch {}
  render();
};
document.getElementById('cls').onchange = e => { cls = e.target.value; render(); };
document.getElementById('sort').onchange = e => { sort = e.target.value; render(); };
document.getElementById('q').oninput = e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#list .row').forEach(r => r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none');
};

const iso = d => d.toLocaleDateString('en-CA');
document.getElementById('events').innerHTML = D.calendar.filter(e => e.date >= iso(TODAY)).slice(0, 5).map(e => `
  <div class="event"><div class="date"><small>${fmtDate(e.date, { month: 'short' })}</small><b>${new Date(e.date).getDate()}</b></div>
  <div><b style="font-size:13px">${esc(e.label)}</b><div class="muted" style="font-size:12px">${e.type === 'no_school' ? 'No school' : titleCase((e.type || '').replace('_', ' '))}</div></div></div>`).join('') || '<span class="muted">Nothing scheduled</span>';
document.getElementById('anns').innerHTML = D.announcements.slice(0, 4).map(a => `
  <div class="ann"><b>${esc(a.title)}</b><span>${esc(titleCase(a.subject))} · ${esc(a.by)} · ${ago(a.at)}</span></div>`).join('');
</script>
</body></html>
