# Continuous deploy: push to main -> build image -> deploy to Cloud Run.
# One-time setup:
#   gcloud artifacts repositories create openlms \
#     --repository-format=docker --location=asia-southeast1
#   Connect this repo in Cloud Build > Triggers, trigger on push to ^main$,
#   using this file as the build config.
# Note: the trigger itself may live in global, but the service and image
# repo must stay regional — Cloud Run has no 'global' deploy region and
# Artifact Registry has no 'global' docker repo. The service lives in
# asia-southeast1 (Singapore) because Cloud Run domain mappings aren't
# supported in asia-south1 (Mumbai).
substitutions:
  _AR_LOCATION: asia-southeast1
  _SERVICE: openlms

# Required when the trigger runs under an explicit service account:
# without this, global-region builds fail with "if 'build.service_account'
# is specified, the build must either (a) specify 'build.logs_bucket'...".
options:
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/openlms/openlms:$COMMIT_SHA'
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/openlms/openlms:$COMMIT_SHA'

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - '--image'
      - '$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/openlms/openlms:$COMMIT_SHA'
      - '--region'
      - asia-southeast1
      - '--platform'
      - managed
      - '--allow-unauthenticated'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '1'
      - '--memory'
      - 1000Mi
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'OPENLMS_PUBLIC_HOST=lms.sidevv.xyz'
      - '--set-secrets'
      - 'OPENLMS_SECRET_KEY=openlms-secret:latest'
      # Secret must exist: openssl rand -base64 32 | gcloud secrets create
      #   openlms-secret --data-file=-   (plus secretAccessor for the
      #   Cloud Run service identity). Fernet-encrypts session tokens at rest.

  # Purge Cloudflare edge cache so new HTML/JS go live together.
  # Without this, Cloudflare serves stale .js against fresh .html after
  # every deploy (it caches by extension, not headers) and the console
  # fills with "not defined" errors. Needs the secret below (one-time):
  #   Cloudflare dashboard > My Profile > API Tokens > Create custom token:
  #     Zone / Cache Purge / Purge, scoped to sidevv.xyz, then
  #   Google Cloud console > Secret Manager > Create secret
  #     'cloudflare-cache-token' with the token as its value.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        ZONE=$(curl -s -H "Authorization: Bearer $$CF_CACHE_TOKEN" \
          "https://api.cloudflare.com/client/v4/zones?name=sidevv.xyz" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
        curl -s -X POST -H "Authorization: Bearer $$CF_CACHE_TOKEN" \
          -H "Content-Type: application/json" \
          "https://api.cloudflare.com/client/v4/zones/$$ZONE/purge_cache" \
          -d '{"purge_everything":true}' \
          | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"
    secretEnv:
      - CF_CACHE_TOKEN

# Secrets used above (referenced as projects/$PROJECT_ID/.../latest).
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-cache-token/versions/latest
      env: CF_CACHE_TOKEN
